name: Deploy AKS production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: ACR image tag sha-<40-character main commit SHA>, not a sha256 digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.repository.private && vars.ENABLE_AZURE_DEPLOYMENTS == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aks-production
    timeout-minutes: 35
    concurrency:
      group: aimie-operations-aks-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve production image commit
        id: resolve
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^sha-[[:xdigit:]]{40}$ ]]; then
            echo 'image_tag must be sha- followed by a 40-character commit SHA' >&2
            exit 1
          fi
          commit_sha=${IMAGE_TAG#sha-}
          git cat-file -e "${commit_sha}^{commit}"
          if ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            echo 'image_tag must identify a commit on main' >&2
            exit 1
          fi
          git checkout --detach "$commit_sha"
      - uses: docker/setup-buildx-action@v4
      - name: Verify GitHub Packages credential
        env:
          PACKAGES_SOURCE_URL: ${{ vars.PACKAGES_SOURCE_URL || 'https://nuget.pkg.github.com/probonolaw/index.json' }}
          PACKAGES_READ_USERNAME: ${{ vars.PACKAGES_READ_USERNAME || github.actor }}
          PACKAGES_READ_TOKEN: ${{ vars.PACKAGES_USE_READ_TOKEN == 'true' && secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          if [[ -z "$PACKAGES_SOURCE_URL" || -z "$PACKAGES_READ_USERNAME" || -z "$PACKAGES_READ_TOKEN" ]]; then
            echo '::error title=Missing GitHub Packages credential::Set PACKAGES_SOURCE_URL, PACKAGES_READ_USERNAME and PACKAGES_READ_TOKEN with access to the orchestration package.'
            exit 1
          fi
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AKS_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_PRODUCTION_SUBSCRIPTION_ID }}
      - name: Sign in to production ACR
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "${ACR_NAME:?Set ACR_NAME}"
      - name: Build and push production worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/aimie-operations:${{ inputs.image_tag }}
          secrets: |
            github_packages_source=${{ vars.PACKAGES_SOURCE_URL || 'https://nuget.pkg.github.com/probonolaw/index.json' }}
            github_packages_credentials=Username=${{ vars.PACKAGES_READ_USERNAME || github.actor }};Password=${{ vars.PACKAGES_USE_READ_TOKEN == 'true' && secrets.PACKAGES_READ_TOKEN || github.token }};ValidAuthenticationTypes=Basic
      - name: Build and push production Markdown Converter image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.markdown-converter
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/markdown-converter:${{ inputs.image_tag }}
      - name: Deploy AIMIE workers and Markdown Converter
        env:
          AKS_SUBSCRIPTION_ID: ${{ vars.AZURE_PRODUCTION_SUBSCRIPTION_ID }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_WORKLOAD_IDENTITY_CLIENT_ID: ${{ vars.AZURE_WORKLOAD_IDENTITY_CLIENT_ID }}
          AZURE_CONVERTER_WORKLOAD_IDENTITY_CLIENT_ID: ${{ vars.AZURE_CONVERTER_WORKLOAD_IDENTITY_CLIENT_ID }}
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          MARKDOWN_CONVERTER_INGRESS_HOST: ${{ vars.MARKDOWN_CONVERTER_INGRESS_HOST }}
          MARKDOWN_CONVERTER_TLS_CERT_KEYVAULT_URI: ${{ vars.MARKDOWN_CONVERTER_TLS_CERT_KEYVAULT_URI }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash scripts/deploy-aks-production.sh
